<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TritonPlanner Booking Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>TritonPlanner</h1>
      <span class="sub">Booking Bridge</span>
    </header>

    <section id="status" class="card">
      <div class="row"><span class="label">Plan</span><span id="plan-status" class="value">—</span></div>
      <div class="row"><span class="label">Sections cached</span><span id="section-status" class="value">—</span></div>
      <div class="row"><span class="label">Last refreshed</span><span id="freshness" class="value">—</span></div>
    </section>

    <section id="plan-detail" class="card hidden">
      <div id="plan-summary" class="summary"></div>
      <ol id="plan-steps"></ol>
    </section>

    <section class="actions">
      <button id="open-admin" class="primary">Manage section data</button>
      <button id="open-tss">Open TSS</button>
    </section>

    <p class="footnote">
      Reads TSS with your existing sign-in and stores results in this browser.
      It never sees your password or Duo code.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
